name = "greengang"
main = "worker/src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Single production Worker + public domain.
routes = [
  { pattern = "greeninstallatienoord.nl", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ENVIRONMENT = "production"
PUBLIC_SITE_URL = "https://greeninstallatienoord.nl"
ADMIN_BASE_PATH = "/blackberry97"
# Public hostname check for Turnstile siteverify (secret stays in `wrangler secret`).
TURNSTILE_EXPECTED_HOSTNAME = "greeninstallatienoord.nl"

[[d1_databases]]
binding = "DB"
database_name = "greeninstallatie"
database_id = "f0728db7-edb9-438c-9a64-5d04ee828137"
migrations_dir = "migrations"

[observability]
enabled = true
